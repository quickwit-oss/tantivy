[package]
name = "vortex-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Experiment: a Vortex-backed columnar for tantivy aggregations, built through the segment plugin system."

# Standalone workspace: keeps the vortex dependency tree out of the tantivy workspace.
[workspace]

[dependencies]
tantivy = { path = ".." }
vortex = { version = "0.88", default-features = false, features = ["files"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same version as the one used by vortex-fastlanes, for single value unpacking.
fastlanes = { version = "0.7", features = ["runtime"] }

[dev-dependencies]
binggan = "0.17.0"
rand = "0.9"
rand_distr = "0.5"

[profile.release]
debug = "line-tables-only"

[profile.bench]
debug = "line-tables-only"

[[bench]]
name = "agg_bench_vortex"
harness = false
