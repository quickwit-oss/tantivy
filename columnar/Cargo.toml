[package]
name = "tantivy-columnar"
version = "0.27.0"
edition = "2024"
license = "MIT"
homepage = "https://github.com/quickwit-oss/tantivy"
repository = "https://github.com/quickwit-oss/tantivy"
description = "column oriented storage for tantivy"
categories = ["database-implementations", "data-structures", "compression"]

[dependencies]
itertools = "0.14.0"
fastdivide = "0.4.0"

stacker = { version= "0.27", path = "../stacker", package="tantivy-stacker"}
sstable = { version= "0.27", path = "../sstable", package = "tantivy-sstable" }
common = { version= "0.27", path = "../common", package = "tantivy-common" }
tantivy-bitpacker = { version= "0.27", path = "../bitpacker/" }
serde = "1.0.152"
downcast-rs = "2.0.1"
rand = "0.9"
# OnPair16 string compression, used by the plain codec of Str and Bytes columns.
onpair = "0.2.1"
# SIMD unpacking and prefix sum of the token ends of OnPair16 blocks.
bitpacking = { version = "0.9.3", default-features = false, features = ["bitpacker4x"] }

[dev-dependencies]
proptest = "1"
more-asserts = "0.3.1"
binggan = "0.17.0"
serde_json = "1"

[[bench]]
name = "bench_merge"
harness = false

[[bench]]
name = "bench_access"
harness = false

[[bench]]
name = "bench_first_vals"
harness = false

[[bench]]
name = "bench_values_u64"
harness = false

[[bench]]
name = "bench_values_u128"
harness = false

[[bench]]
name = "bench_create_column_values"
harness = false

[[bench]]
name = "bench_column_values_get"
harness = false

[[bench]]
name = "bench_optional_index"
harness = false

[[bench]]
name = "bench_multivalue_docids"
harness = false

[[bench]]
name = "bench_plain_block"
harness = false

[features]
zstd-compression = ["sstable/zstd-compression"]
